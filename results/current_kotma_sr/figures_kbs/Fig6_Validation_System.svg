   <g id="text_1">
    <text style="fill: #262626; font: 700 9px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="203.76" y="11.08512" transform="rotate(-0 203.76 11.08512)">Leakage-safe validation system for sparse production histories</text>
   </g>
   <g id="text_2">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="55.1088" y="60.281972" transform="rotate(-0 55.1088 60.281972)">34 PCB sides</text>
   </g>
   <g id="text_3">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="55.1088" y="72.155536" transform="rotate(-0 55.1088 72.155536)">21 physical boards</text>
   </g>
   <g id="text_4">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="159.5664" y="60.279066" transform="rotate(-0 159.5664 60.279066)">Outer grouped LOBO</text>
   </g>
   <g id="text_5">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="159.5664" y="72.177849" transform="rotate(-0 159.5664 72.177849)">hold out both A/B sides</text>
   </g>
   <g id="text_6">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="264.024" y="60.279066" transform="rotate(-0 264.024 60.279066)">Inner grouped LOBO</text>
   </g>
   <g id="text_7">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="264.024" y="72.147966" transform="rotate(-0 264.024 72.147966)">tune only on histories</text>
   </g>
   <g id="text_8">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="358.4376" y="60.281972" transform="rotate(-0 358.4376 60.281972)">One reveal</text>
   </g>
   <g id="text_9">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="358.4376" y="72.177849" transform="rotate(-0 358.4376 72.177849)">outer evaluation</text>
   </g>
   <g id="text_10">
    <text style="fill: #b03a48; font: 700 6.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="203.76" y="101.34144" transform="rotate(-0 203.76 101.34144)">Outer outcomes never enter scaling, tuning, calibration or recommendation</text>
   </g>
   <g id="text_11">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="49.0824" y="149.998427" transform="rotate(-0 49.0824 149.998427)">Baselines</text>
   </g>
   <g id="text_12">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(33.210244 160.680655)">CBR, median,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(28.814681 166.074861)">unconstrained OT</text>
   </g>
   <g id="text_13">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="129.4344" y="149.998427" transform="rotate(-0 129.4344 149.998427)">Ablations</text>
   </g>
   <g id="text_14">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(110.160783 160.68185)">FGW, safeguard,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(111.001088 166.135822)">bounded update</text>
   </g>
   <g id="text_15">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="209.7864" y="150.033161" transform="rotate(-0 209.7864 150.033161)">Small-sample</text>
   </g>
