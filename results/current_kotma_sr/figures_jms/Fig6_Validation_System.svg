   <g id="text_1">
    <text style="fill: #262626; font: 700 9px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="204.12" y="11.44512" transform="rotate(-0 204.12 11.44512)">Leakage-safe validation system for sparse production histories</text>
   </g>
   <g id="text_2">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="55.4688" y="60.641972" transform="rotate(-0 55.4688 60.641972)">34 PCB sides</text>
   </g>
   <g id="text_3">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="55.4688" y="72.515536" transform="rotate(-0 55.4688 72.515536)">21 physical boards</text>
   </g>
   <g id="text_4">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="159.9264" y="60.639066" transform="rotate(-0 159.9264 60.639066)">Outer grouped LOBO</text>
   </g>
   <g id="text_5">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="159.9264" y="72.537849" transform="rotate(-0 159.9264 72.537849)">hold out both A/B sides</text>
   </g>
   <g id="text_6">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="264.384" y="60.639066" transform="rotate(-0 264.384 60.639066)">Inner grouped LOBO</text>
   </g>
   <g id="text_7">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="264.384" y="72.507966" transform="rotate(-0 264.384 72.507966)">tune only on histories</text>
   </g>
   <g id="text_8">
    <text style="fill: #262626; font: 700 6.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="358.7976" y="60.641972" transform="rotate(-0 358.7976 60.641972)">One reveal</text>
   </g>
   <g id="text_9">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="358.7976" y="72.537849" transform="rotate(-0 358.7976 72.537849)">outer evaluation</text>
   </g>
   <g id="text_10">
    <text style="fill: #b03a48; font: 700 6.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="204.12" y="101.70144" transform="rotate(-0 204.12 101.70144)">Outer outcomes never enter scaling, tuning, calibration or recommendation</text>
   </g>
   <g id="text_11">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="49.4424" y="150.358427" transform="rotate(-0 49.4424 150.358427)">Baselines</text>
   </g>
   <g id="text_12">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(33.570244 161.040655)">CBR, median,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(29.174681 166.434861)">unconstrained OT</text>
   </g>
   <g id="text_13">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="129.7944" y="150.358427" transform="rotate(-0 129.7944 150.358427)">Ablations</text>
   </g>
   <g id="text_14">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(110.520783 161.04185)">FGW, safeguard,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(111.361087 166.495822)">bounded update</text>
   </g>
   <g id="text_15">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="210.1464" y="150.393161" transform="rotate(-0 210.1464 150.393161)">Small-sample</text>
   </g>
   <g id="text_16">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(199.514095 161.040655)">5, 10, 20,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(197.392017 166.434861)">all histories</text>
   </g>
   <g id="text_17">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="290.4984" y="150.358427" transform="rotate(-0 290.4984 150.358427)">Controls</text>
   </g>
   <g id="text_18">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(271.416033 160.980889)">random memory,</text>
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(273.771595 166.434861)">pad-count only</text>
   </g>
   <g id="text_19">
    <text style="fill: #262626; font: 700 5.7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="370.8504" y="150.358427" transform="rotate(-0 370.8504 150.358427)">Trust</text>
   </g>
   <g id="text_20">
    <text style="fill: #52616b; font: 5.1px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(353.421947 161.010772)">intervals, OOD,</text>
